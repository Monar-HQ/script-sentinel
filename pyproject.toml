[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptsentinel"
version = "1.0.0rc1"
description = "CLI-first audit of third-party JavaScript: inventory, integrity baselines, CSP misconfiguration detection, IOC matching, and verifiable remediation."
readme = "README.md"
requires-python = ">=3.11.5"
license = { text = "MIT" }
authors = [{ name = "MONAR", email = "mail@monarservices.org" }]
maintainers = [{ name = "MONAR", email = "mail@monarservices.org" }]
keywords = ["csp", "supply-chain", "javascript", "integrity", "security", "sri", "pci-dss"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "tree-sitter>=0.25,<0.28",
    "tree-sitter-javascript>=0.23,<0.26",
    "beautifulsoup4>=4.12",
    "soupsieve>=4.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://www.monarservices.org"
Repository = "https://github.com/Monar-HQ/scriptsentinel"
Issues = "https://github.com/Monar-HQ/scriptsentinel/issues"
Documentation = "https://github.com/Monar-HQ/scriptsentinel/tree/main/docs"
Changelog = "https://github.com/Monar-HQ/scriptsentinel/blob/main/CHANGELOG.md"

[project.optional-dependencies]
release = ["build>=1.2", "pyinstaller>=6", "pip-audit>=2.9"]
browser = ["playwright>=1.50,<2"]
credentials = ["keyring>=25,<26"]
dev = [
    "trio>=0.25",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[project.scripts]
scriptsentinel = "scriptsentinel.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["scriptsentinel*"]

[tool.setuptools.package-data]
scriptsentinel = ["iocs/feeds/*.json", "web/*", "knowledge/*.json", "demo/*", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
files = ["src/scriptsentinel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires the local OPTIJACK lab to be running"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["scriptsentinel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
