<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1440,height=540">
  <title>ScriptSentinel workflow</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <style>
    html,body{margin:0;width:1440px;height:540px;overflow:hidden;background:#101110}
    #stage{position:relative;width:100%;height:100%;overflow:hidden}
  </style>
</head>
<body>
  <div id="stage" data-composition-id="main" data-start="0" data-duration="8" data-width="1440" data-height="540" data-fps="20">
    <div id="workflow-scene" class="clip" data-composition-id="workflow" data-composition-src="compositions/workflow.html" data-start="0" data-duration="8" data-track-index="0" data-track-kind="graphics" data-width="1440" data-height="540"></div>
  </div>
  <script>
    const tl=gsap.timeline({paused:true});
    window.__timelines["main"]=tl;
    tl.seek(0);
  </script>
</body>
</html>
