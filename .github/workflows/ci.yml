name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint, Type Check, and Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and typed optional integrations
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e ".[dev,browser,credentials]"
      - name: Ruff
        run: ruff check .
      - name: Mypy strict
        run: mypy --strict src/scriptsentinel

  test:
    name: Test Suite (${{ matrix.python-version }} on ${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e ".[dev]"
      - name: Run Pytest
        run: pytest -v

  package:
    name: Build and Install Wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel and sdist
        run: python -m build
      - name: Install wheel and verify console script
        run: |
          python -m pip install dist/*.whl
          scriptsentinel --version
          python -m scriptsentinel.cli --help
          scriptsentinel demo
          scriptsentinel benchmark
      - name: Produce software inventory
        run: python packaging/sbom.py dist/sbom.cdx.json

  browser:
    name: Real browser workflows
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - name: Select isolated browser executable
        run: python -c "from playwright.sync_api import sync_playwright; import os; p=sync_playwright().start(); open(os.environ['GITHUB_ENV'],'a').write('SCRIPTSENTINEL_BROWSER_EXECUTABLE='+p.chromium.executable_path+'\n'); p.stop()"
      - run: python -m pytest tests/test_browser_workflows.py -v

  dependency-audit:
    name: Locked runtime dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.lock --no-deps --require-hashes
