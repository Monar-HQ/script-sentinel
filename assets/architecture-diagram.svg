<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 220" width="846" height="220" fill="none">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Base Canvas -->
  <rect width="846" height="220" fill="#04050a" stroke="#232730" stroke-width="1"/>
  <rect x="0" y="0" width="846" height="1" fill="#d9000b"/>

  <!-- Stage 1: Client DOM & Script Ingestion -->
  <g transform="translate(24, 30)">
    <rect width="210" height="160" fill="#080a11" stroke="#1d222e" stroke-width="1"/>
    <rect x="0" y="0" width="210" height="26" fill="#0d111a"/>
    <text x="12" y="17" class="mono" font-size="9.5" font-weight="700" fill="#8892b0" letter-spacing="1">1. INGESTION PLANE</text>
    
    <text x="12" y="52" class="mono" font-size="11" font-weight="600" fill="#f8fafc">DOM &amp; Scripts</text>
    <text x="12" y="70" class="sans" font-size="11" fill="#64748b">• External &lt;script&gt; tags</text>
    <text x="12" y="88" class="sans" font-size="11" fill="#64748b">• Inline script blocks</text>
    <text x="12" y="106" class="sans" font-size="11" fill="#64748b">• Dynamic document.write</text>
    <text x="12" y="124" class="sans" font-size="11" fill="#64748b">• HTTP Response CSP</text>
    <text x="12" y="142" class="sans" font-size="11" fill="#64748b">• Pinned baseline hashes</text>
  </g>

  <!-- Connector 1 -->
  <g transform="translate(234, 110)">
    <line x1="0" y1="0" x2="36" y2="0" stroke="#d9000b" stroke-width="1.5"/>
    <polygon points="36,-3 42,0 36,3" fill="#d9000b"/>
  </g>

  <!-- Stage 2: ScriptSentinel Multi-Vector Inspection -->
  <g transform="translate(276, 30)">
    <rect width="294" height="160" fill="#080a11" stroke="#2a3242" stroke-width="1"/>
    <rect x="0" y="0" width="294" height="26" fill="#0f1422"/>
    <text x="12" y="17" class="mono" font-size="9.5" font-weight="700" fill="#d9000b" letter-spacing="1">2. CODESENTINEL CORE ENGINE</text>

    <!-- Sub-Block A: SRI -->
    <g transform="translate(12, 38)">
      <rect width="270" height="32" fill="#05070d" stroke="#1c212e" stroke-width="1"/>
      <text x="10" y="20" class="mono" font-size="10" font-weight="600" fill="#38bdf8">SRI &amp; Cryptographic Drift</text>
      <text x="260" y="20" text-anchor="end" class="mono" font-size="9" fill="#64748b">SHA-256 / 384</text>
    </g>

    <!-- Sub-Block B: CSP -->
    <g transform="translate(12, 76)">
      <rect width="270" height="32" fill="#05070d" stroke="#1c212e" stroke-width="1"/>
      <text x="10" y="20" class="mono" font-size="10" font-weight="600" fill="#818cf8">CSP Directive Analyzer</text>
      <text x="260" y="20" text-anchor="end" class="mono" font-size="9" fill="#64748b">Grade A–F</text>
    </g>

    <!-- Sub-Block C: AST -->
    <g transform="translate(12, 114)">
      <rect width="270" height="32" fill="#05070d" stroke="#1c212e" stroke-width="1"/>
      <text x="10" y="20" class="mono" font-size="10" font-weight="600" fill="#f43f5e">Behavioral AST &amp; IOC Feed</text>
      <text x="260" y="20" text-anchor="end" class="mono" font-size="9" fill="#64748b">Magecart / C2</text>
    </g>
  </g>

  <!-- Connector 2 -->
  <g transform="translate(570, 110)">
    <line x1="0" y1="0" x2="36" y2="0" stroke="#d9000b" stroke-width="1.5"/>
    <polygon points="36,-3 42,0 36,3" fill="#d9000b"/>
  </g>

  <!-- Stage 3: Defense & Compliance Output -->
  <g transform="translate(612, 30)">
    <rect width="210" height="160" fill="#080a11" stroke="#1d222e" stroke-width="1"/>
    <rect x="0" y="0" width="210" height="26" fill="#0d111a"/>
    <text x="12" y="17" class="mono" font-size="9.5" font-weight="700" fill="#8892b0" letter-spacing="1">3. ACTIONABLE REMEDIATION</text>

    <text x="12" y="52" class="mono" font-size="11" font-weight="600" fill="#f8fafc">Artifacts &amp; Gates</text>
    <text x="12" y="70" class="sans" font-size="11" fill="#64748b">• Hardened CSP Header</text>
    <text x="12" y="88" class="sans" font-size="11" fill="#64748b">• Drop-in SRI &lt;script&gt; tags</text>
    <text x="12" y="106" class="sans" font-size="11" fill="#64748b">• Nginx / Apache configs</text>
    <text x="12" y="124" class="sans" font-size="11" fill="#64748b">• PCI-DSS 6.4.3 / 11.6.1</text>
    <text x="12" y="142" class="sans" font-size="11" fill="#10b981">• CI/CD Gate Enforcement</text>
  </g>
</svg>