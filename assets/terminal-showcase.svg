      </text>
      <rect y="18" width="896" height="24" fill="#111c2e"/>
      <text x="12" y="34" class="mono" font-size="11" font-weight="700" fill="#94a3b8">#  ORIGIN / SCRIPT URL</text>
      <text x="290" y="34" class="mono" font-size="11" font-weight="700" fill="#94a3b8">SRI INTEGRITY</text>
      <text x="440" y="34" class="mono" font-size="11" font-weight="700" fill="#94a3b8">SHA-256 (TRUNC)</text>
      <text x="610" y="34" class="mono" font-size="11" font-weight="700" fill="#94a3b8">THREAT SIGNATURES</text>

