        <text x="294" y="15" class="mono" font-size="10.5" font-weight="700" fill="#fda4af">SCRIPT_DRIFT</text>
        <text x="440" y="14" class="mono" font-size="11" fill="#94a3b8">e4bfd3a819c4... (!)</text>
        <text x="610" y="14" class="mono" font-size="11" fill="#f43f5e" font-weight="600">SKIM-INPUT-HARVEST (CVV)</text>
      </g>
      <!-- Row 2 -->
      <g transform="translate(0, 72)">
        <text x="12" y="14" class="mono" font-size="11.5" fill="#f8fafc">02 https://analytics.sdk.io/track.js</text>
        <rect x="286" y="2" width="100" height="18" rx="3" fill="#2e1a06" stroke="#d97706" stroke-width="0.8"/>
        <text x="294" y="15" class="mono" font-size="10.5" font-weight="700" fill="#fde68a">MISSING_SRI</text>
        <text x="440" y="14" class="mono" font-size="11" fill="#94a3b8">9a11f4bc071d...</text>
        <text x="610" y="14" class="mono" font-size="11" fill="#fbbf24">SKIM-DOM-LISTENER (Keydown)</text>
      </g>
      <!-- Row 3 -->
      <g transform="translate(0, 96)">
        <text x="12" y="14" class="mono" font-size="11.5" fill="#f8fafc">03 https://checkout.io/bundle.min.js</text>
        <rect x="286" y="2" width="86" height="18" rx="3" fill="#0c2415" stroke="#059669" stroke-width="0.8"/>
        <text x="294" y="15" class="mono" font-size="10.5" font-weight="700" fill="#86efac">VERIFIED</text>
        <text x="440" y="14" class="mono" font-size="11" fill="#94a3b8">7c20ad51ef8a...</text>
        <text x="610" y="14" class="mono" font-size="11" fill="#10b981">Clean · No Skimmer Patterns</text>
      </g>
    </g>

    <!-- Bottom Action Summary -->
    <g transform="translate(0, 380)">
      <rect width="896" height="52" rx="6" fill="#09131e" stroke="#172b42" stroke-width="1"/>
      <text x="16" y="22" class="mono" font-size="11.5" fill="#38bdf8">
        ✔ Hardened CSP header &amp; drop-in SRI &lt;script&gt; tags generated
      </text>
      <text x="16" y="39" class="mono" font-size="11.5" fill="#10b981">
        ✔ PCI-DSS v4.0 Req 6.4.3 script ledger &amp; Req 11.6.1 tamper alerts saved to audit_report.json
      </text>
