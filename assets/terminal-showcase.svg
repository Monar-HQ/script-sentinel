      <!-- Row 2 -->
      <g transform="translate(0, 70)">
        <text x="12" y="14" class="mono" font-size="11.5" fill="#f8fafc">CSP-CONNECT-WILD</text>
        <rect x="156" y="2" width="60" height="17" rx="3" fill="#2d0c14"/>
        <text x="162" y="14" class="mono" font-size="10" font-weight="700" fill="#f43f5e">CRIT</text>
        <text x="230" y="14" class="mono" font-size="11" fill="#cbd5e1">Wildcard connect-src allows exfiltration to rogue C2s</text>
        <text x="640" y="14" class="mono" font-size="11" fill="#38bdf8">Restrict connect-src 'self'</text>
      </g>
    </g>

    <!-- Section 2: JavaScript SRI & Behavioral Scan -->
    <g transform="translate(0, 246)">
      <text y="10" class="mono" font-size="11" font-weight="700" fill="#38bdf8">
