<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="560" fill="none">
  <defs>
    <linearGradient id="term-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#0a101b"/>
    </linearGradient>
    <linearGradient id="term-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f19"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <filter id="term-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- Terminal Window Shadow & Body -->
  <rect x="8" y="8" width="944" height="544" rx="14" fill="url(#term-inner)" stroke="#1e2d42" stroke-width="1.5" filter="url(#term-drop)"/>
  <rect x="8" y="8" width="944" height="544" rx="14" fill="url(#term-inner)" stroke="#1e2d42" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="8" y="8" width="944" height="42" rx="14" fill="url(#term-frame)"/>
  <rect x="8" y="32" width="944" height="18" fill="url(#term-frame)"/>
  <line x1="8" y1="50" x2="952" y2="50" stroke="#1e2d42" stroke-width="1"/>

  <!-- Mac Buttons -->
  <circle cx="34" cy="29" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="29" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="29" r="6" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="480" y="33" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#64748b">
    bash — scriptsentinel audit https://payments.checkout.io/pay --baseline baselines.json
  </text>

  <!-- CLI Output Body -->
  <g transform="translate(32, 78)">
    <!-- Prompt Command -->
    <text y="0" class="mono" font-size="13" font-weight="500" fill="#94a3b8">
      <tspan fill="#38bdf8">ally@monar:~$</tspan> scriptsentinel audit https://payments.checkout.io/pay --baseline baselines.json
    </text>

    <!-- CodeSentinel Mini ASCII / Badge line -->
    <g transform="translate(0, 20)">
      <text y="14" class="mono" font-size="11" font-weight="700" fill="#38bdf8">
        CodeSentinel <tspan fill="#64748b">v0.1.0 · Client-Side Supply-Chain Defense &amp; SRI Drift Auditor (MONAR)</tspan>
      </text>
    </g>

    <!-- Summary Box Card -->
    <g transform="translate(0, 50)">
      <rect width="896" height="74" rx="6" fill="#0c1422" stroke="#1e2e46" stroke-width="1"/>
      <line x1="0" y1="26" x2="896" y2="26" stroke="#1e2e46" stroke-width="1"/>
      <text x="14" y="18" class="mono" font-size="11" font-weight="700" fill="#38bdf8">
        AUDIT EXECUTIVE SUMMARY
      </text>
      <text x="750" y="18" class="mono" font-size="11" font-weight="600" fill="#10b981">
        HTTP 200 OK
      </text>

      <text x="14" y="46" class="mono" font-size="12" fill="#94a3b8">
        Target URL: <tspan fill="#f8fafc">https://payments.checkout.io/pay</tspan>
      </text>
      <text x="14" y="64" class="mono" font-size="12" fill="#94a3b8">
        Overall Risk: <tspan fill="#f43f5e" font-weight="700">CRITICAL (Score: 94/100)</tspan>   │   CSP Health Grade: <tspan fill="#f43f5e" font-weight="700">F (0/100)</tspan>   │   Discovered Scripts: <tspan fill="#f8fafc">3 external, 1 inline</tspan>
      </text>
    </g>

    <!-- Section 1: CSP Analysis Table -->
    <g transform="translate(0, 142)">
