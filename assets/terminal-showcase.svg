      </text>
      <rect y="18" width="896" height="24" fill="#111c2e"/>
      <text x="12" y="34" class="mono" font-size="11" font-weight="700" fill="#94a3b8">RULE ID</text>
      <text x="160" y="34" class="mono" font-size="11" font-weight="700" fill="#94a3b8">SEV</text>
      <text x="230" y="34" class="mono" font-size="11" font-weight="700" fill="#94a3b8">FINDING &amp; VECTOR DESCRIPTION</text>
      <text x="640" y="34" class="mono" font-size="11" font-weight="700" fill="#94a3b8">REMEDIATION</text>

      <!-- Row 1 -->
      <g transform="translate(0, 48)">
        <text x="12" y="14" class="mono" font-size="11.5" fill="#f8fafc">CSP-MISSING</text>
        <rect x="156" y="2" width="60" height="17" rx="3" fill="#2d0c14"/>
        <text x="162" y="14" class="mono" font-size="10" font-weight="700" fill="#f43f5e">CRIT</text>
        <text x="230" y="14" class="mono" font-size="11" fill="#cbd5e1">Header completely missing; zero origin containment</text>
        <text x="640" y="14" class="mono" font-size="11" fill="#38bdf8">Deploy nonced CSP header</text>
