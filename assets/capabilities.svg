<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
<title id="title">Three stages of a ScriptSentinel review</title><desc id="desc">Collect a script inventory, review integrity and syntax signals, then validate proposed changes with operator approval.</desc>
<rect width="1440" height="440" rx="12" fill="#101110"/>
<g stroke="#70889b" fill="none"><path d="M480 32V408M960 32V408" stroke="#343a33"/><rect x="58" y="67" width="70" height="82" rx="5"/><rect x="72" y="53" width="70" height="82" rx="5"/><path d="M88 76H125M88 89H125M88 102H113"/>
<circle cx="572" cy="99" r="43"/><path d="M551 100L567 116L594 82" stroke="#dffc70" stroke-width="3"/><circle cx="572" cy="99" r="30" stroke-dasharray="3 7"/>
<rect x="1027" y="58" width="86" height="78" rx="5"/><path d="M1044 80H1097M1044 96H1097M1044 112H1073"/><path d="M1084 120L1097 133L1120 108" stroke="#dffc70" stroke-width="3"/></g>
<g font-family="monospace" font-size="12" fill="#dffc70"><text x="400" y="77">01</text><text x="880" y="77">02</text><text x="1360" y="77">03</text></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#f1f3e9"><g font-size="32" font-weight="600" letter-spacing="-.7"><text x="58" y="220">Collect</text><text x="538" y="220">Review</text><text x="1018" y="220">Control</text></g>
<g font-size="19" fill="#b0b6a9"><text x="58" y="266">Inventory referenced JavaScript</text><text x="58" y="296">from local files or an authorized</text><text x="58" y="326">browser observation.</text>
<text x="538" y="266">Inspect syntax signals, integrity</text><text x="538" y="296">and CSP. Compare changed bytes</text><text x="538" y="326">against reviewed artifacts.</text>
<text x="1018" y="266">Stage a proposed change, validate</text><text x="1018" y="296">it separately and approve before</text><text x="1018" y="326">applying it.</text></g>
<g font-family="monospace" font-size="12" fill="#b0b6a9"><text x="58" y="393">HTML / JS / HAR</text><text x="538" y="393">AST / SRI / CSP</text><text x="1018" y="393">DIFF / VALIDATION / RECOVERY</text></g></g></svg>
