<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 220" width="846" height="220" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#171922" stroke-width="0.75"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="846" height="220" fill="#04050a" stroke="#232730" stroke-width="1"/>
  <rect width="846" height="220" fill="url(#grid)"/>

  <!-- Top Accent Band (Monar Red) -->
  <rect x="0" y="0" width="846" height="2" fill="#d9000b"/>

  <!-- Left Technical Geometric Monogram -->
  <g transform="translate(40, 42)">
    <!-- Outer Chamfered Hex Box -->
    <path d="M0 16 L16 0 H96 L112 16 V96 L96 112 H16 L0 96 Z" fill="#090b12" stroke="#2a303c" stroke-width="1.2"/>
    
    <!-- Monar Red Corner Accents -->
    <path d="M0 24 L0 16 L16 0 L24 0" fill="none" stroke="#d9000b" stroke-width="2"/>
    <path d="M112 88 L112 96 L96 112 L88 112" fill="none" stroke="#d9000b" stroke-width="2"/>
    
    <!-- Inner Crosshair / Optical Sensor Geometry -->
    <circle cx="56" cy="56" r="32" fill="none" stroke="#1d222e" stroke-width="1"/>
    <circle cx="56" cy="56" r="20" fill="#0d1017" stroke="#3b4252" stroke-width="1"/>
    <circle cx="56" cy="56" r="6" fill="#d9000b"/>
    
    <!-- Hairline Reticle Lines -->
    <line x1="14" y1="56" x2="30" y2="56" stroke="#4c566a" stroke-width="1"/>
    <line x1="82" y1="56" x2="98" y2="56" stroke="#4c566a" stroke-width="1"/>
    <line x1="56" y1="14" x2="56" y2="30" stroke="#4c566a" stroke-width="1"/>
    <line x1="56" y1="82" x2="56" y2="98" stroke="#4c566a" stroke-width="1"/>
  </g>

  <!-- Vertical Divider -->
  <line x1="182" y1="36" x2="182" y2="184" stroke="#1c202a" stroke-width="1"/>

  <!-- Main Headline & Narrative -->
  <g transform="translate(206, 0)">
    <!-- Metadata Flag -->
    <g transform="translate(0, 48)">
      <rect width="72" height="18" fill="#141722" stroke="#2b3140" stroke-width="0.8"/>
      <text x="36" y="13" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#8892b0" letter-spacing="1.2">MONAR</text>
      <text x="82" y="13" class="mono" font-size="9" font-weight="600" fill="#64748b" letter-spacing="1">DEFENSIVE ENGINE · v0.1.0</text>
    </g>

    <!-- Product Title -->
    <text x="0" y="98" class="sans" font-size="34" font-weight="800" fill="#fbfaf7" letter-spacing="-0.8">
      ScriptSentinel
    </text>

    <!-- Subtitle (Direct & Engineering-First) -->
    <text x="0" y="126" class="sans" font-size="13" font-weight="400" fill="#94a3b8">
      Client-side JavaScript security auditor: SRI drift tracking, CSP hardening, &amp; DOM skimmer triage.
    </text>

    <!-- Bottom Feature Tags (Precision Chamfered Chips) -->
    <g transform="translate(0, 150)">
      <!-- Tag 1 -->
      <g>
        <path d="M0 0 H120 L126 6 V22 H6 L0 16 Z" fill="#090c14" stroke="#252b38" stroke-width="1"/>
        <text x="12" y="15" class="mono" font-size="9.5" font-weight="600" fill="#cbd5e1">SRI HASH DRIFT</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(136, 0)">
        <path d="M0 0 H124 L130 6 V22 H6 L0 16 Z" fill="#090c14" stroke="#252b38" stroke-width="1"/>
        <text x="12" y="15" class="mono" font-size="9.5" font-weight="600" fill="#cbd5e1">CSP GRADING (A–F)</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(276, 0)">
        <path d="M0 0 H144 L150 6 V22 H6 L0 16 Z" fill="#090c14" stroke="#252b38" stroke-width="1"/>
        <text x="12" y="15" class="mono" font-size="9.5" font-weight="600" fill="#cbd5e1">MAGECART / OPTIJACK</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(436, 0)">
        <path d="M0 0 H144 L150 6 V22 H6 L0 16 Z" fill="#090c14" stroke="#252b38" stroke-width="1"/>
        <text x="12" y="15" class="mono" font-size="9.5" font-weight="600" fill="#cbd5e1">PCI-DSS 6.4.3 / 11.6.1</text>
      </g>
    </g>
  </g>

  <!-- Bottom Corner Mark -->
  <path d="M836 220 L846 210 V220 Z" fill="#d9000b"/>
</svg>