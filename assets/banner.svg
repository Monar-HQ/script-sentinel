<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="260">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="960" height="260" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Cyber Grid Pattern Accent -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="40" x2="960" y2="40"/>
    <line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="200" x2="960" y2="200"/>
    <line x1="80" y1="0" x2="80" y2="260"/>
    <line x1="160" y1="0" x2="160" y2="260"/>
    <line x1="240" y1="0" x2="240" y2="260"/>
    <line x1="320" y1="0" x2="320" y2="260"/>
    <line x1="400" y1="0" x2="400" y2="260"/>
    <line x1="480" y1="0" x2="480" y2="260"/>
    <line x1="560" y1="0" x2="560" y2="260"/>
    <line x1="640" y1="0" x2="640" y2="260"/>
    <line x1="720" y1="0" x2="720" y2="260"/>
    <line x1="800" y1="0" x2="800" y2="260"/>
    <line x1="880" y1="0" x2="880" y2="260"/>
  </g>

  <!-- Hexagon / Shield Icon -->
  <g transform="translate(60, 55)">
    <!-- Outer Glow Shield -->
    <path d="M75 10 L135 45 L135 105 L75 140 L15 105 L15 45 Z" fill="none" stroke="url(#shield-grad)" stroke-width="3" filter="url(#glow)" opacity="0.6"/>
    <path d="M75 10 L135 45 L135 105 L75 140 L15 105 L15 45 Z" fill="#0f172a" stroke="url(#shield-grad)" stroke-width="2.5"/>
    <!-- Inner Lock / Sentinel Eye -->
    <circle cx="75" cy="72" r="22" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="75" cy="72" r="9" fill="#38bdf8"/>
    <path d="M50 72 L60 72 M90 72 L100 72 M75 47 L75 57 M75 87 L75 97" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(230, 95)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="#f8fafc" letter-spacing="-1">
      Code<tspan fill="#38bdf8">Sentinel</tspan>
    </text>
    <text y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="16" fill="#94a3b8" letter-spacing="0.2">
      Client-Side Supply-Chain Defense, JavaScript Drift Tracking &amp; CSP Hardening
    </text>
  </g>

  <!-- Pill Badges -->
  <g transform="translate(230, 165)">
    <!-- Pill 1: SRI Tracking -->
    <g>
      <rect width="135" height="30" rx="15" fill="#0f2b3e" stroke="#0284c7" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4.5" fill="#38bdf8"/>
      <text x="28" y="19.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#bae6fd">SRI Drift Engine</text>
    </g>

    <!-- Pill 2: CSP Grading -->
    <g transform="translate(145, 0)">
      <rect width="130" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4.5" fill="#818cf8"/>
      <text x="28" y="19.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">CSP Audit A–F</text>
    </g>

    <!-- Pill 3: Magecart & OPTIJACK -->
    <g transform="translate(285, 0)">
      <rect width="185" height="30" rx="15" fill="#311313" stroke="#e11d48" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4.5" fill="#fb7185"/>
      <text x="28" y="19.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fecdd3">Magecart / OPTIJACK</text>
    </g>

    <!-- Pill 4: PCI-DSS v4.0 -->
    <g transform="translate(480, 0)">
      <rect width="155" height="30" rx="15" fill="#142c1b" stroke="#16a34a" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4.5" fill="#4ade80"/>
      <text x="28" y="19.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#bbf7d0">PCI-DSS v4.0 Ready</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="256" width="960" height="4" fill="url(#accent-cyan)"/>
</svg>