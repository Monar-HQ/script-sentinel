<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <linearGradient id="bg-banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e"/>
      <stop offset="45%" stop-color="#0c121d"/>
      <stop offset="100%" stop-color="#04070b"/>
    </linearGradient>

    <linearGradient id="shield-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="0" r="1.2" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <filter id="shield-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-banner)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Radial Glow -->
  <circle cx="160" cy="180" r="150" fill="url(#glow-grad)"/>

  <!-- Left: Geometric Sentinel Shield Mark -->
  <g transform="translate(80, 85)">
    <path d="M80 15 L145 48 L145 125 C145 155 118 178 80 190 C42 178 15 155 15 125 L15 48 Z"
          fill="#0c1626" stroke="url(#shield-stroke)" stroke-width="3" filter="url(#shield-shadow)"/>
    
    <path d="M80 30 L132 58 L132 120 C132 144 110 163 80 173 C50 163 28 144 28 120 L28 58 Z"
          fill="#0a101b" stroke="#1e3a5f" stroke-width="1.5"/>

    <circle cx="80" cy="105" r="36" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
    <circle cx="80" cy="105" r="22" fill="#0c1a2e" stroke="#38bdf8" stroke-width="2"/>
    
    <circle cx="80" cy="105" r="7" fill="#38bdf8"/>
    <line x1="50" y1="105" x2="68" y2="105" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="92" y1="105" x2="110" y2="105" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="75" x2="80" y2="93" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="117" x2="80" y2="135" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Vertical Divider -->
  <line x1="275" y1="65" x2="275" y2="295" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Content Group -->
  <g transform="translate(315, 0)">
    <g transform="translate(0, 82)">
      <circle cx="6" cy="6" r="4.5" fill="#10b981"/>
      <circle cx="6" cy="6" r="8" fill="none" stroke="#10b981" stroke-width="1" opacity="0.4"/>
      <text x="24" y="10" class="mono" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2.5">
        MONAR OPEN-SOURCE DEFENSE · SCRIPT AUDITOR v0.1.0
      </text>
    </g>

    <text x="0" y="152" class="sans" font-size="52" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">
      Code<tspan fill="url(#text-grad)">Sentinel</tspan>
    </text>

    <text x="0" y="196" class="sans" font-size="18.5" font-weight="400" fill="#94a3b8">
      Client-side supply-chain defense: audit third-party JS, track SRI drift, &amp; enforce PCI-DSS v4.0.
    </text>

    <g transform="translate(0, 240)">
      <g>
        <rect width="180" height="34" rx="8" fill="#0c1e2e" stroke="#0284c7" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#38bdf8"/>
        <text x="28" y="22" class="mono" font-size="12" font-weight="600" fill="#bae6fd">SRI Drift Detection</text>
      </g>

      <g transform="translate(192, 0)">
        <rect width="170" height="34" rx="8" fill="#151a30" stroke="#4f46e5" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#818cf8"/>
        <text x="28" y="22" class="mono" font-size="12" font-weight="600" fill="#c7d2fe">CSP Health (A–F)</text>
      </g>

      <g transform="translate(374, 0)">
        <rect width="215" height="34" rx="8" fill="#261016" stroke="#e11d48" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#fb7185"/>
        <text x="28" y="22" class="mono" font-size="12" font-weight="600" fill="#fecdd3">Magecart / OPTIJACK</text>
      </g>

      <g transform="translate(601, 0)">
        <rect width="195" height="34" rx="8" fill="#0d2417" stroke="#16a34a" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#4ade80"/>
        <text x="28" y="22" class="mono" font-size="12" font-weight="600" fill="#bbf7d0">PCI-DSS 6.4.3 &amp; 11.6.1</text>
      </g>
    </g>
  </g>

  <rect x="0" y="356" width="1200" height="4" fill="url(#shield-stroke)"/>
</svg>