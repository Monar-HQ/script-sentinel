<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <!-- Background Gradient Light -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Shield Glow & Gradients -->
    <linearGradient id="shield-stroke-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="text-grad-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <pattern id="grid-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.8"/>
      <circle cx="40" cy="0" r="1.2" fill="#0284c7" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-light)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid-light)"/>

  <!-- Left: Geometric Sentinel Shield Mark -->
  <g transform="translate(80, 85)">
    <!-- Outer Shield -->
    <path d="M80 15 L145 48 L145 125 C145 155 118 178 80 190 C42 178 15 155 15 125 L15 48 Z"
          fill="#f0f9ff" stroke="url(#shield-stroke-l)" stroke-width="3"/>
    
    <!-- Inner Geometric Facets -->
    <path d="M80 30 L132 58 L132 120 C132 144 110 163 80 173 C50 163 28 144 28 120 L28 58 Z"
          fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Radar Pulse Rings -->
    <circle cx="80" cy="105" r="36" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
    <circle cx="80" cy="105" r="22" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Core Crosshair Sentinel Eye -->
    <circle cx="80" cy="105" r="7" fill="#0284c7"/>
    <line x1="50" y1="105" x2="68" y2="105" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <line x1="92" y1="105" x2="110" y2="105" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="75" x2="80" y2="93" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="117" x2="80" y2="135" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Vertical Divider -->
  <line x1="275" y1="65" x2="275" y2="295" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Content Group -->
  <g transform="translate(315, 0)">
    <!-- Top Eyebrow Metadata -->
    <g transform="translate(0, 82)">
      <circle cx="6" cy="6" r="4.5" fill="#059669"/>
      <circle cx="6" cy="6" r="8" fill="none" stroke="#059669" stroke-width="1" opacity="0.4"/>
      <text x="24" y="10" class="mono" font-size="12" font-weight="700" fill="#475569" letter-spacing="2.5">
        MONAR OPEN-SOURCE DEFENSE · SCRIPT AUDITOR v0.1.0
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" class="sans" font-size="52" font-weight="800" fill="#0f172a" letter-spacing="-1.5">
      Code<tspan fill="url(#text-grad-l)">Sentinel</tspan>
    </text>

    <!-- Subtitle / Pitch -->
    <text x="0" y="196" class="sans" font-size="18.5" font-weight="400" fill="#475569">
      Client-side supply-chain defense: audit third-party JS, track SRI drift, &amp; enforce PCI-DSS v4.0.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 240)">
      <!-- Pill 1: SRI -->
      <g>
        <rect width="180" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#0284c7"/>
        <text x="28" y="22" class="mono" font-size="12" font-weight="600" fill="#0369a1">SRI Drift Detection</text>
      </g>

      <!-- Pill 2: CSP -->
      <g transform="translate(192, 0)">
        <rect width="170" height="34" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#4f46e5"/>
        <text x="28" y="22" class="mono" font-size="12" font-weight="600" fill="#3730a3">CSP Health (A–F)</text>
      </g>

      <!-- Pill 3: Magecart & OPTIJACK -->
      <g transform="translate(374, 0)">
        <rect width="215" height="34" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#e11d48"/>
        <text x="28" y="22" class="mono" font-size="12" font-weight="600" fill="#9f1239">Magecart / OPTIJACK</text>
      </g>

      <!-- Pill 4: PCI-DSS v4.0 -->
      <g transform="translate(601, 0)">
        <rect width="195" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#16a34a"/>
        <text x="28" y="22" class="mono" font-size="12" font-weight="600" fill="#15803d">PCI-DSS 6.4.3 &amp; 11.6.1</text>
      </g>
    </g>
  </g>

  <!-- Accent Bottom Border Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#shield-stroke-l)"/>
</svg>