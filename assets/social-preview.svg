    <path d="M170 0 H324 L330 6 V22 H176 L170 16 Z" fill="#090c14" stroke="#252b38" stroke-width="1"/>
    <text x="182" y="15" class="mono" font-size="9" font-weight="600" fill="#cbd5e1">CSP · A–F</text>
    <path d="M340 0 H494 L500 6 V22 H346 L340 16 Z" fill="#090c14" stroke="#252b38" stroke-width="1"/>
    <text x="352" y="15" class="mono" font-size="9" font-weight="600" fill="#cbd5e1">PCI-DSS 6.4.3 / 11.6.1</text>
  </g>

