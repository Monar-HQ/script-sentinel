    <rect width="536" height="512" fill="#080a11" stroke="#232730" stroke-width="1"/>
    <rect width="536" height="32" fill="#090b12"/>
    <rect x="16" y="13" width="6" height="6" fill="#3b4252"/>
    <rect x="32" y="13" width="6" height="6" fill="#3b4252"/>
    <rect x="48" y="13" width="6" height="6" fill="#3b4252"/>
    <text x="268" y="21" text-anchor="middle" class="mono" font-size="9" fill="#64748b">scriptsentinel audit</text>

    <text x="16" y="54" class="mono" font-size="9.5" fill="#94a3b8"><tspan fill="#d9000b">ally@monar:~$</tspan> scriptsentinel audit http://localhost:8100/no-csp/checkout</text>

    <g transform="translate(16 66)">
