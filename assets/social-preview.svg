      <text x="10" y="33" class="mono" font-size="8" fill="#64748b">TARGET</text>
      <text x="56" y="33" class="mono" font-size="9" fill="#fbfaf7">http://localhost:8100/no-csp/checkout</text>
      <text x="494" y="33" text-anchor="end" class="mono" font-size="8.5" fill="#fbfaf7">HTTP 200</text>
      <text x="10" y="49" class="mono" font-size="8" fill="#64748b">RISK</text>
      <text x="48" y="49" class="mono" font-size="9" font-weight="700" fill="#d9000b">CRITICAL</text>
      <text x="130" y="49" class="mono" font-size="8" fill="#64748b">CSP</text>
      <text x="162" y="49" class="mono" font-size="9" font-weight="700" fill="#d9000b">F (0/100)</text>
      <text x="250" y="49" class="mono" font-size="8" fill="#64748b">SCRIPTS</text>
      <text x="306" y="49" class="mono" font-size="9" fill="#fbfaf7">1 external</text>
