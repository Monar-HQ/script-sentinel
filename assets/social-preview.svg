  <line x1="64" y1="576" x2="1216" y2="576" stroke="#1c202c" stroke-width="1"/>
  <rect x="64" y="592" width="5" height="5" fill="#d9000b"/>
  <text x="76" y="597" class="mono" font-size="10" font-weight="700" fill="#fbfaf7" letter-spacing="1.5">BY MONAR</text>
  <text x="190" y="597" class="mono" font-size="9" fill="#8892b0">monarservices.org</text>
  <text x="1216" y="597" text-anchor="end" class="mono" font-size="9" fill="#64748b">Infrastructure &amp; AI compute: Unquant · Luke</text>
