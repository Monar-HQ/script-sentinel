<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="ScriptSentinel by MONAR. Client-side JavaScript integrity, CSP grading, behavioral skimmer detection, and PCI-DSS v4.0 evidence.">
  <title>ScriptSentinel by MONAR. Client-side JavaScript integrity, CSP grading, behavioral skimmer detection, and PCI-DSS v4.0 evidence.</title>
  <defs>
    <pattern id="social-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141822" stroke-width="0.6"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#04050a"/>
  <rect width="1280" height="640" fill="url(#social-grid)"/>
  <rect width="1280" height="4" fill="#d9000b"/>

  <!-- Integrity seal -->
  <g transform="translate(64 64)">
    <path d="M0 12 L12 0 H52 L64 12 V52 L52 64 H12 L0 52 Z" fill="#080a11" stroke="#252b38" stroke-width="1"/>
    <path d="M6 18 L18 6 H46 L58 18 V46 L46 58 H18 L6 46 Z" fill="#0d1017" stroke="#3b4252" stroke-width="1"/>
    <path d="M32 20 L44 32 L32 44 L20 32 Z" fill="#d9000b"/>
    <path d="M0 12 L12 0 H18" fill="none" stroke="#d9000b" stroke-width="1.5"/>
    <path d="M64 52 L52 64 H46" fill="none" stroke="#d9000b" stroke-width="1.5"/>
  </g>

  <rect x="152" y="65" width="5" height="5" fill="#d9000b"/>
  <text x="164" y="70" class="mono" font-size="11" font-weight="700" fill="#8892b0" letter-spacing="1.5">MONAR / CLIENT-SIDE DEFENSE</text>

  <text x="152" y="136" class="sans" font-size="56" font-weight="800" fill="#fbfaf7" letter-spacing="-1.2">ScriptSentinel</text>

  <text x="152" y="178" class="sans" font-size="20" font-weight="400" fill="#94a3b8">Audit the JavaScript your checkout runs.</text>

  <text x="152" y="206" class="sans" font-size="14" font-weight="400" fill="#64748b">SRI drift · CSP grading · behavioral skimmers · PCI-DSS v4.0 evidence.</text>

  <g transform="translate(152 232)">
    <path d="M0 0 H154 L160 6 V22 H6 L0 16 Z" fill="#090c14" stroke="#252b38" stroke-width="1"/>
