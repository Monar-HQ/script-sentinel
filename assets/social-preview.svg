      <text x="120" y="17" class="mono" font-size="8.5" font-weight="700" fill="#d9000b">CRITICAL</text>
      <text x="200" y="17" class="mono" font-size="8.5" fill="#94a3b8">No Content-Security-Policy header</text>
      <text x="10" y="34" class="mono" font-size="8" fill="#64748b">ACTION</text>
      <text x="62" y="34" class="mono" font-size="8.5" fill="#fbfaf7">Deploy nonced default-src 'self'</text>
    </g>

    <g transform="translate(16 178)">
      <rect width="504" height="42" fill="#05070d" stroke="#1c212e" stroke-width="1"/>
      <text x="10" y="17" class="mono" font-size="9" fill="#fbfaf7">http://localhost:8001/js/acme.js</text>
      <text x="330" y="17" class="mono" font-size="8.5" font-weight="700" fill="#d9000b">MISSING_SRI</text>
      <text x="10" y="34" class="mono" font-size="8" fill="#64748b">SHA-256</text>
      <text x="70" y="34" class="mono" font-size="8.5" fill="#8892b0">1ddc1b32fb1e4bc6...</text>
      <text x="330" y="34" class="mono" font-size="8.5" fill="#fbfaf7">SCAN CLEAN</text>
    </g>

    <g transform="translate(16 228)">
      <rect width="504" height="170" fill="#05070d" stroke="#1c212e" stroke-width="1"/>
      <text x="10" y="17" class="mono" font-size="8" font-weight="700" fill="#d9000b" letter-spacing="1">REMEDIATION QUICK-PACK</text>
      <text x="10" y="36" class="mono" font-size="7.2" fill="#8892b0">default-src 'self'; script-src 'self' 'nonce-{NONCE}' http://localhost:8001;</text>
      <text x="10" y="50" class="mono" font-size="7.2" fill="#8892b0">script-src-elem 'self' 'nonce-{NONCE}' http://localhost:8001; connect-src 'self'; report-uri /api/csp-report</text>
      <text x="10" y="70" class="mono" font-size="7" fill="#fbfaf7">&lt;script src="http://localhost:8001/js/acme.js"</text>
      <text x="10" y="84" class="mono" font-size="7" fill="#fbfaf7">integrity="sha256-HdwbMvseS8acAXHY00VRiX4AG9aivqn38TbzRUKFiwE=" crossorigin="anonymous"&gt;</text>
      <text x="10" y="98" class="mono" font-size="7" fill="#fbfaf7">&lt;/script&gt;</text>
      <text x="10" y="118" class="mono" font-size="7.5" fill="#94a3b8">Report written: report/no-csp.json</text>
      <text x="10" y="136" class="mono" font-size="7.5" fill="#94a3b8">PCI-DSS v4.0 6.4.3 / 11.6.1 evidence included</text>
    </g>

    <rect x="16" y="410" width="504" height="30" fill="#090c14" stroke="#1e2433" stroke-width="1"/>
    <text x="26" y="429" class="mono" font-size="8" fill="#8892b0">AUDIT SEAL · SHA-256 1ddc1b32fb1e4bc6...</text>
    <text x="510" y="429" text-anchor="end" class="mono" font-size="8" fill="#64748b">MONAR / v0.1.0</text>

    <rect x="0" y="510" width="536" height="2" fill="#d9000b"/>
