<rect width="1440" height="760" rx="12" fill="#eeefe8"/><rect x="24" y="94" width="1392" height="642" fill="url(#dots)"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#101110"><text x="48" y="57" font-size="25" font-weight="600">Inside a review</text><text x="1392" y="57" text-anchor="end" font-family="monospace" font-size="12" fill="#53604c">LOCAL EVIDENCE / EXPLICIT APPROVAL</text></g>
<g fill="none" stroke="#6b7860" stroke-width="2" marker-end="url(#arrow)"><path d="M332 244H414"/><path d="M714 244H800"/><path d="M1100 244H1180"/><path d="M950 334V394"/><path d="M1100 472H1180"/><path d="M554 334V376H344V405" stroke-dasharray="5 5"/></g>
<g fill="#f9faf5" stroke="#adb6a3"><rect x="48" y="154" width="284" height="180" rx="8"/><rect x="414" y="154" width="300" height="180" rx="8"/><rect x="800" y="154" width="300" height="180" rx="8"/><rect x="800" y="394" width="300" height="166" rx="8"/></g>
<rect x="1180" y="154" width="212" height="406" rx="8" fill="#101110"/>
<g font-family="monospace" font-size="12" fill="#65715d"><text x="72" y="186">01 / SCOPED INPUTS</text><text x="438" y="186">02 / ANALYSIS</text><text x="824" y="186">03 / LOCAL RECORD</text><text x="824" y="426">04 / CHANGE REVIEW</text></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#101110"><g font-size="23" font-weight="600"><text x="72" y="229">Your webroot</text><text x="438" y="229">Deterministic Core</text><text x="824" y="229">Evidence ledger</text><text x="824" y="469">Proposed diff</text></g>
<g font-size="17" fill="#53604c"><text x="72" y="269">Local HTML and scripts</text><text x="72" y="298">Authorized browser / HAR</text><text x="438" y="269">Syntax signals · SRI · CSP</text><text x="438" y="298">Bounded reads and errors</text><text x="824" y="269">Inventory and observations</text><text x="824" y="298">Reviewed baseline hashes</text><text x="824" y="506">Temporary-copy validation</text><text x="824" y="535">Recovery copy and receipt</text></g></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#f1f3e9"><text x="1202" y="199" font-family="monospace" font-size="11" fill="#dffc70">OPERATOR GATE</text><text x="1202" y="250" font-size="21" font-weight="600">Application tests</text><text x="1202" y="283" font-size="16" fill="#b0b6a9">Review compatibility</text><path d="M1202 315H1370" stroke="#343a33"/><text x="1202" y="355" font-size="21" font-weight="600">Explicit approval</text><text x="1202" y="388" font-size="16" fill="#b0b6a9">Apply or reject</text><path d="M1202 421H1370" stroke="#343a33"/><text x="1202" y="465" font-size="21" font-weight="600">Guarded recovery</text><text x="1202" y="498" font-size="16" fill="#b0b6a9">Refuse later edits</text></g>
<rect x="48" y="410" width="594" height="150" rx="8" fill="#e0e5d7" stroke="#adb6a3" stroke-dasharray="5 5"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#101110"><text x="72" y="447" font-family="monospace" font-size="12" fill="#53604c">OPTIONAL / ADVISORY ONLY</text><text x="72" y="487" font-size="23" font-weight="600">Provider or existing host agent</text><text x="72" y="527" font-size="17" fill="#53604c">Minimized findings for interpretation; no approval authority.</text></g>
<path d="M72 615H1370" stroke="#adb6a3"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53604c"><text x="72" y="654">The console prepares changes. Applying them is an explicit CLI action.</text><text x="72" y="692">A reviewed snapshot is an operator assertion; application compatibility requires its own tests.</text></g></svg>
