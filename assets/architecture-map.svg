<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">ScriptSentinel architecture and approval boundary</title><desc id="desc">Scoped inputs enter deterministic analysis and a local evidence ledger. Reviewed baselines support patch proposals. Optional AI provides advisory interpretation. Operator approval and application tests precede applying changes.</desc>
