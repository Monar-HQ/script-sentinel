<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 110" width="846" height="110" fill="none">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Base Card -->
  <rect width="846" height="110" fill="#04050a" stroke="#232730" stroke-width="1"/>
  <rect x="0" y="0" width="846" height="1" fill="#d9000b"/>

  <!-- Left: Unquant Identity Block -->
  <g transform="translate(32, 28)">
    <!-- Technical Geometric Monogram -->
    <path d="M0 0 H36 L44 8 V44 H8 L0 36 Z" fill="#090c14" stroke="#2e3544" stroke-width="1"/>
    <text x="22" y="28" text-anchor="middle" class="mono" font-size="16" font-weight="800" fill="#f8fafc">UQ</text>

    <!-- Partner Brand Name -->
    <text x="56" y="22" class="sans" font-size="18" font-weight="700" fill="#fbfaf7" letter-spacing="-0.3">
      Unquant
    </text>
    <text x="56" y="38" class="mono" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">
      unquant.io
    </text>
  </g>

  <!-- Vertical Divider -->
  <line x1="210" y1="20" x2="210" y2="90" stroke="#1c212c" stroke-width="1"/>

  <!-- Right: Infrastructure Attribution & Thanks to Luke -->
  <g transform="translate(236, 32)">
    <g transform="translate(0, 0)">
      <rect width="180" height="16" fill="#141722" stroke="#232a38" stroke-width="0.8"/>
      <text x="90" y="11" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#8892b0" letter-spacing="1">
        INFRASTRUCTURE &amp; AI PARTNER
      </text>
    </g>

    <text x="0" y="34" class="sans" font-size="12.5" fill="#94a3b8">
      Simulation clusters and model runtime access provided by <tspan fill="#f8fafc" font-weight="600">Unquant</tspan>.
    </text>
    <text x="0" y="52" class="sans" font-size="12" fill="#64748b">
      Special thanks to <tspan fill="#d9000b" font-weight="600">Luke</tspan> at Unquant for championing open-source client-side defense research.
    </text>
  </g>

  <!-- Chamfer Bottom Accent -->
  <path d="M836 110 L846 100 V110 Z" fill="#d9000b"/>
</svg>