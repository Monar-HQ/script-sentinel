<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 140" width="846" height="140" fill="none">
  <defs>
    <linearGradient id="unquant-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="50%" stop-color="#0b162a"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>

    <linearGradient id="unquant-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="unquant-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="unquant-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="0.8" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Container -->
  <rect width="846" height="140" rx="12" fill="url(#unquant-bg)" stroke="#1e2d45" stroke-width="1.2"/>
  <rect width="846" height="140" rx="12" fill="url(#unquant-dots)"/>

  <!-- Left Glyph Icon (Quantum / Diamond node) -->
  <g transform="translate(36, 32)">
    <rect width="76" height="76" rx="16" fill="#0c172a" stroke="url(#unquant-accent)" stroke-width="1.8" filter="url(#unquant-glow)"/>
    <rect width="76" height="76" rx="16" fill="#091222" stroke="url(#unquant-accent)" stroke-width="1.5"/>
    
    <!-- Geometric Unquant Logo Mark -->
    <path d="M38 18 L56 38 L38 58 L20 38 Z" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
    <circle cx="38" cy="38" r="6" fill="#818cf8"/>
    <circle cx="38" cy="38" r="13" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Content Group -->
  <g transform="translate(136, 30)">
    <!-- Eyebrow -->
    <g>
      <circle cx="5" cy="5" r="4" fill="#6366f1"/>
      <text x="18" y="9" class="mono" font-size="11" font-weight="700" fill="#818cf8" letter-spacing="1.5">
        INFRASTRUCTURE &amp; AI COMPUTE PARTNER
      </text>
    </g>

    <!-- Partner Title -->
    <text x="0" y="44" class="sans" font-size="24" font-weight="800" fill="#f8fafc">
      Unquant <tspan fill="#64748b" font-weight="400" font-size="15">·</tspan> <tspan font-size="16" font-weight="600" fill="#38bdf8">unquant.io</tspan>
    </text>

    <!-- Narrative & Luke Special Thanks -->
    <text x="0" y="70" class="sans" font-size="13.5" font-weight="400" fill="#94a3b8">
      High-performance compute clusters and AI model infrastructure powering CodeSentinel simulations and drift testing.
    </text>
    <text x="0" y="90" class="sans" font-size="12.5" font-weight="500" fill="#cbd5e1">
      Special thanks to <tspan fill="#f8fafc" font-weight="700">Luke</tspan> at Unquant for championing client-side open-source security research.
    </text>
  </g>

  <!-- External Link Indicator -->
  <g transform="translate(780, 52)">
    <circle cx="20" cy="18" r="16" fill="#111c2e" stroke="#2563eb" stroke-width="1"/>
    <path d="M16 22 L24 14 M24 14 H18 M24 14 V20" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>