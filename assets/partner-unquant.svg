<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 110" width="846" height="110" role="img" aria-label="Unquant infrastructure and AI compute partner. Special thanks to Luke.">
  <title>Unquant infrastructure and AI compute partner. Special thanks to Luke.</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <rect width="846" height="110" fill="#04050a" stroke="#232730" stroke-width="1"/>
  <rect width="846" height="1" fill="#d9000b"/>

  <g transform="translate(28 28)">
    <path d="M0 8 L8 0 H36 L44 8 V36 L36 44 H8 L0 36 Z" fill="#090c14" stroke="#2e3544" stroke-width="1"/>
    <text x="22" y="27" text-anchor="middle" class="mono" font-size="15" font-weight="800" fill="#fbfaf7">UQ</text>
    <text x="58" y="20" class="sans" font-size="18" font-weight="700" fill="#fbfaf7" letter-spacing="-0.3">Unquant</text>
    <text x="58" y="35" class="mono" font-size="9" font-weight="600" fill="#64748b" letter-spacing="1">unquant.io</text>
  </g>

  <line x1="220" y1="16" x2="220" y2="94" stroke="#1c212c" stroke-width="1"/>

  <g transform="translate(244 26)">
    <rect x="0" y="-6" width="5" height="5" fill="#d9000b"/>
    <text x="12" y="-1" class="mono" font-size="8.5" font-weight="700" fill="#8892b0" letter-spacing="1.2">INFRASTRUCTURE &amp; AI COMPUTE</text>
    <text x="0" y="25" class="sans" font-size="11" fill="#94a3b8">Simulation clusters and model runtime access provided by <tspan fill="#fbfaf7" font-weight="600">Unquant</tspan>.</text>
    <text x="0" y="48" class="sans" font-size="10.5" fill="#64748b">Special thanks to <tspan fill="#d9000b" font-weight="600">Luke</tspan> for championing open-source client-side defense research.</text>
  </g>

  <path d="M836 110 L846 100 V110 Z" fill="#d9000b"/>
</svg>
